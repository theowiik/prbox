[project]
name = "box"
version = "0.3.0"
description = "A generic LED display box: connectors POST events, the box renders them"
requires-python = ">=3.14"
# What runs on the Pi, and nothing more. uvicorn's [standard] extra is spelled
# out instead, because it also drags in a file watcher, PyYAML and dotenv,
# none of which the box uses outside `make dev`.
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "websockets>=17.2",
    "httptools>=0.8",
    "uvloop>=0.23; sys_platform != 'win32'",
]

[project.scripts]
box = "box.__main__:main"

[project.optional-dependencies]
# Installed on the Raspberry Pi only. The `rgbmatrix` module itself is built
# from hzeller/rpi-rgb-led-matrix and is not available on PyPI.
pi = ["pillow>=12.3"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.16",
    # `make dev` restarts on code changes; the Pi never does.
    "watchfiles>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is built on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
