[project]
name = "box"
version = "0.3.0"
description = "A generic LED display box: connectors POST events, the box renders them"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "websockets>=17.0",
]

[project.scripts]
box = "box.__main__:main"

[project.optional-dependencies]
# Installed on the Raspberry Pi only. The `rgbmatrix` module itself is built
# from hzeller/rpi-rgb-led-matrix and is not available on PyPI.
pi = ["pillow>=12.0"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx2>=2.12",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is built on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
