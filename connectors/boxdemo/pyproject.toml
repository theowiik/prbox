[project]
name = "boxdemo"
version = "0.1.0"
description = "Generative visuals for a box display — rainbow blobs and Game of Life"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.12",
]

[project.scripts]
boxdemo = "boxdemo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boxdemo"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.16"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
