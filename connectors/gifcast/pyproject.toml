[project]
name = "gifcast"
version = "0.1.0"
description = "Send a GIF to a box display"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3",
    "httpx2>=2.13",
]

[project.scripts]
gifcast = "gifcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gifcast"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
