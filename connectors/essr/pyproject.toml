[project]
name = "essr"
version = "0.1.0"
description = "Show new En Stor Stark Review reviews on a box display"
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.13",
]

[project.scripts]
essr = "essr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essr"]

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
