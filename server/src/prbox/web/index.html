<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>prbox</title>
<style>
:root{
  --bg:#0d0d14;--surface:#16161f;--surface-2:#1e1e2b;--border:#2a2a3a;
  --text:#ececf2;--dim:#8a8a9c;--accent:#6366f1;--ok:#22c55e;--bad:#ef4444;--r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#1a1a2e,var(--bg));
  color:var(--text);min-height:100vh;padding:2rem 1.5rem 3rem;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
.wrap{max-width:880px;margin:0 auto}
header{display:flex;align-items:baseline;gap:.75rem;margin-bottom:1.5rem}
h1{font-size:1.4rem;font-weight:650;letter-spacing:-.02em}
.sub{color:var(--dim);font-size:.8rem}
.status{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad);transition:background .2s}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}

.stage{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:1.25rem;margin-bottom:1rem;
}
.stage-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
.stage-head h2{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.meta{margin-left:auto;font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
#screen{
  display:block;width:100%;height:auto;image-rendering:pixelated;
  background:#050507;border-radius:8px;
}
.controls{display:flex;align-items:center;gap:.75rem;margin-top:.9rem}
.controls label{font-size:.72rem;color:var(--dim);white-space:nowrap}
input[type="range"]{flex:1;accent-color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:1.1rem;
}
.card-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem}
.card-head h2{font-size:.85rem;font-weight:600}
.badge{
  font-size:.58rem;background:var(--surface-2);color:var(--dim);
  padding:.15rem .45rem;border-radius:5px;text-transform:uppercase;
  letter-spacing:.06em;margin-left:auto;
}
.w-temp{font-size:2.4rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.w-cond{font-size:.85rem;margin-top:.15rem}
.w-rows{margin-top:.6rem;display:grid;gap:.2rem}
.w-rows div{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim)}
.actions{display:flex;align-items:center;gap:.6rem;margin-top:.9rem;flex-wrap:wrap}
.field{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
  padding:.5rem .7rem;border-radius:9px;font-size:.85rem;font-family:inherit;
}
.field:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:.5rem;align-items:center;margin-top:.7rem}
input[type="color"]{width:34px;height:34px;border:1px solid var(--border);background:none;cursor:pointer;border-radius:8px;padding:2px}
.btn{
  background:var(--accent);color:#fff;border:none;padding:.45rem .9rem;
  border-radius:9px;cursor:pointer;font-size:.78rem;font-family:inherit;
  transition:filter .15s;white-space:nowrap;
}
.btn:hover{filter:brightness(1.15)}
.btn:active{filter:brightness(.9)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--dim)}
.btn-ghost:hover{border-color:var(--dim);color:var(--text);filter:none}
.toggle{display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--dim);cursor:pointer}
.toggle input{accent-color:var(--accent)}
.slider-row{display:flex;align-items:center;gap:.6rem;margin-top:.55rem}
.slider-row label{font-size:.7rem;color:var(--dim);width:4.5rem}
.slider-row input[type=range]{flex:1;accent-color:var(--accent)}
.slider-row span{font-size:.7rem;color:var(--dim);width:2.2rem;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>prbox</h1>
  <span class="sub">Event display box</span>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
</header>

<section class="stage">
  <div class="stage-head">
    <h2>Live panel</h2>
    <span class="meta" id="meta">—</span>
  </div>
  <canvas id="screen"></canvas>
  <div class="controls">
    <label for="b">Brightness</label>
    <input type="range" id="b" min="0" max="100" value="100">
    <span class="meta" id="bval">100%</span>
    <button class="btn btn-ghost" onclick="post('/clear')">Clear</button>
  </div>
</section>

<div class="grid">
  <div class="card">
    <div class="card-head"><h2>Weather</h2><span class="badge">Mock</span></div>
    <div class="w-temp" id="w-temp">—</div>
    <div class="w-cond" id="w-cond"></div>
    <div class="w-rows">
      <div><span>City</span><span id="w-city">—</span></div>
      <div><span>Feels like</span><span id="w-feels">—</span></div>
      <div><span>Humidity</span><span id="w-hum">—</span></div>
      <div><span>Wind</span><span id="w-wind">—</span></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="pushWeather()">Push to display</button>
      <label class="toggle"><input type="checkbox" id="w-auto"> Auto</label>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Text</h2></div>
    <input class="field" type="text" id="t" placeholder="Long text scrolls…" maxlength="512">
    <div class="row">
      <input type="color" id="c" value="#00ff00">
      <button class="btn" onclick="sendText()">Send</button>
      <button class="btn btn-ghost" onclick="sendSolid()">Fill</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Rainbow blobs</h2></div>
    <div class="slider-row">
      <label for="r-speed">Speed</label>
      <input type="range" id="r-speed" min="0" max="60" value="8">
      <span id="r-speed-v">0.08</span>
    </div>
    <div class="slider-row">
      <label for="r-blobs">Blobs</label>
      <input type="range" id="r-blobs" min="0" max="12" value="4">
      <span id="r-blobs-v">4</span>
    </div>
    <div class="slider-row">
      <label for="r-noise">Noise</label>
      <input type="range" id="r-noise" min="0" max="100" value="25">
      <span id="r-noise-v">0.25</span>
    </div>
    <div class="slider-row">
      <label for="r-sat">Sat</label>
      <input type="range" id="r-sat" min="0" max="100" value="100">
      <span id="r-sat-v">1.00</span>
    </div>
    <div class="actions">
      <button class="btn" onclick="sendRainbow()">Start</button>
    </div>
  </div>
</div>
</div>

<script>
'use strict';
const API = '/api/display';
const $ = id => document.getElementById(id);

async function post(path, body) {
  const opts = { method: 'POST' };
  if (body !== undefined) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (!res.ok) console.error(path, res.status, await res.text());
  return res;
}

/* ---------- panel rendering ---------- */
/* The server streams finished RGB frames, so the browser only has to blow the
   pixels up into round "LEDs" — no font or layout logic lives here. */

const canvas = $('screen');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, CELL = 0, GAP = 0;
let frame = null, dirty = false;
let frames = 0, fpsShown = 0, lastFpsAt = performance.now();

function layout(w, h) {
  W = w; H = h;
  const avail = Math.min(canvas.parentElement.clientWidth, 840);
  CELL = Math.max(4, Math.floor(avail / w) - 2);
  GAP = Math.max(1, Math.round(CELL / 5));
  const step = CELL + GAP;
  canvas.width = w * step + GAP;
  canvas.height = h * step + GAP;
  canvas.style.width = '100%';
}

function paint() {
  requestAnimationFrame(paint);
  if (!dirty || !frame) return;
  dirty = false;

  const step = CELL + GAP, rad = CELL / 2;
  ctx.fillStyle = '#050507';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 3;
      const r = frame[i], g = frame[i + 1], b = frame[i + 2];
      const cx = GAP + x * step + rad, cy = GAP + y * step + rad;
      const lit = r + g + b;

      // Unlit LEDs stay visibly dark grey so the panel grid reads as hardware.
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, 6.2832);
      ctx.fillStyle = lit ? `rgb(${r},${g},${b})` : '#14141c';
      ctx.fill();

      if (lit > 90) {
        // Cheap bloom: one translucent halo per lit pixel beats canvas shadows.
        const grad = ctx.createRadialGradient(cx, cy, rad * 0.4, cx, cy, rad * 2.1);
        grad.addColorStop(0, `rgba(${r},${g},${b},0.34)`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, rad * 2.1, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  frames++;
  const now = performance.now();
  if (now - lastFpsAt >= 1000) {
    fpsShown = Math.round(frames * 1000 / (now - lastFpsAt));
    frames = 0; lastFpsAt = now;
    $('meta').textContent = `${W}×${H} · ${fpsShown} fps`;
  }
}
requestAnimationFrame(paint);

/* ---------- frame stream ---------- */

let ws = null, retry = 500;

function setConn(ok, label) {
  $('dot').classList.toggle('on', ok);
  $('conn').textContent = label;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/display`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => { retry = 500; setConn(true, 'live'); };

  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'hello') layout(msg.width, msg.height);
      return;
    }
    frame = new Uint8Array(ev.data);
    dirty = true;
  };

  ws.onclose = () => {
    setConn(false, 'reconnecting');
    // Back off so a stopped server does not turn into a reconnect storm.
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  };

  ws.onerror = () => ws.close();
}
connect();
window.addEventListener('resize', () => { if (W) { layout(W, H); dirty = true; } });

/* ---------- weather ---------- */

let weather = null, autoTimer = null;

async function loadWeather() {
  const res = await fetch('/api/sources/weather');
  weather = await res.json();
  $('w-temp').textContent = weather.temp + '°C';
  $('w-temp').style.color = weather.display_color;
  $('w-cond').textContent = weather.condition;
  $('w-cond').style.color = weather.display_color;
  $('w-city').textContent = weather.city;
  $('w-feels').textContent = weather.feels_like + '°C';
  $('w-hum').textContent = weather.humidity + '%';
  $('w-wind').textContent = weather.wind_kph + ' km/h';
  return weather;
}

async function pushWeather() {
  const w = weather || await loadWeather();
  await post('/text', { text: w.display_text, color: w.display_color });
}

$('w-auto').addEventListener('change', e => {
  clearInterval(autoTimer);
  autoTimer = null;
  if (!e.target.checked) return;
  pushWeather();
  autoTimer = setInterval(() => loadWeather().then(pushWeather), 30000);
});

/* ---------- controls ---------- */

function sendText() {
  const el = $('t');
  if (!el.value.trim()) return;
  post('/text', { text: el.value, color: $('c').value });
  el.value = '';
}

function sendSolid() { post('/solid', { color: $('c').value }); }

function sendRainbow() {
  post('/rainbow', {
    speed: $('r-speed').value / 100,
    blobs: +$('r-blobs').value,
    noise: $('r-noise').value / 100,
    saturation: $('r-sat').value / 100,
  });
}

$('t').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

let brightnessTimer = null;
$('b').addEventListener('input', e => {
  const v = +e.target.value;
  $('bval').textContent = v + '%';
  // Debounce: the slider fires far faster than the panel needs updating.
  clearTimeout(brightnessTimer);
  brightnessTimer = setTimeout(() => post('/brightness', { brightness: v / 100 }), 40);
});

for (const [id, fmt] of [
  ['r-speed', v => (v / 100).toFixed(2)],
  ['r-blobs', v => v],
  ['r-noise', v => (v / 100).toFixed(2)],
  ['r-sat', v => (v / 100).toFixed(2)],
]) {
  const el = $(id), out = $(id + '-v');
  el.addEventListener('input', () => { out.textContent = fmt(+el.value); sendRainbow(); });
}

loadWeather();
setInterval(loadWeather, 60000);
</script>
</body>
</html>
